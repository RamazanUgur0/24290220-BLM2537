        <main class="odak-sayfasi">

                <form id="kayitFormu">
                    <p>
                        <label for="eposta">E-posta Adresi:</label><br>
                        <input type="email" id="eposta" name="eposta" placeholder="ornek@gmail.com" required>
                    </p>
                    <p>
                        <label for="sifre">Şifre:</label><br>
                        <input type="password" id="sifre" name="sifre" required>
                    </p>
                    <p>
                        <label for="sifreTekrar">Şifreyi Onayla:</label><br>
                        <input type="password" id="sifreTekrar" name="sifreTekrar" required>
                    </p>
                    <button type="submit">Kayıt Ol</button>
                </form>
                <p>Zaten bir hesabınız var mı? <a href="giris.html">Giriş Yap</a></p>
            </section>
